<mat-sidenav-container class="app-container">
  <!-- Sidebar Menu -->
  <mat-sidenav
    #sidenav
    class="app-sidenav"
    [mode]="sidenavMode"
    [opened]="sidenavOpened"
  >
    <mat-toolbar color="primary">{{title}}</mat-toolbar>
    <p class="cms-tagline">powered by <span style="font-style:italic">BIE-CMS</span></p>
    <mat-nav-list>
      <a mat-list-item href="author">Canvas</a>
      <a mat-list-item href="upload">Media Upload</a>
      <a mat-list-item href="#">Blog</a>
    </mat-nav-list>
  </mat-sidenav>
  <!-- Main Content -->
  <mat-sidenav-content>
    <!-- Sidebar Toggle -->
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="spacer"></span>
    </mat-toolbar>

    <!-- Content routes -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
