<div class="inspector-section inspector-inline-media">
  <div class="inline-media-actions">
    <button type="button" class="palette-button" (click)="addInlineImage()"
      [disabled]="images().length >= maxImages">
      + Add inline image
    </button>
    <p class="inspector-note">Place up to {{ maxImages }} images around this text block.</p>
  </div>

  @if (!images().length) {
  <p class="inspector-empty">No inline images yet.</p>
  }

  @for (image of images(); track trackImage($index, image); let i = $index) {
  <div class="inline-media-card">
    <div class="inline-media-card-header">
      <h5>Image {{ i + 1 }}</h5>
      <button type="button" class="inspector-link danger" (click)="removeInlineImage(image.id)">
        Remove
      </button>
    </div>
    <label>
      <span>Placement</span>
      <select [ngModel]="image.placement" (ngModelChange)="onPlacementChange(image.id, $event)">
        @for (placement of placements; track placement) {
        <option [ngValue]="placement">{{ placement | titlecase }}</option>
        }
      </select>
    </label>
    <label>
      <span>Size</span>
      <select [ngModel]="image.size" (ngModelChange)="onSizeChange(image.id, $event)">
        @for (size of sizes; track size) {
        <option [ngValue]="size">{{ size | titlecase }}</option>
        }
      </select>
    </label>
    <label>
      <span>Image URL</span>
      <input type="text" [ngModel]="image.src" (ngModelChange)="onSrcChange(image.id, $event)">
    </label>
    <label>
      <span>Alt text</span>
      <input type="text" [ngModel]="image.alt" (ngModelChange)="onAltChange(image.id, $event)">
    </label>
    <label>
      <span>Caption</span>
      <input type="text" [ngModel]="image.caption" (ngModelChange)="onCaptionChange(image.id, $event)">
    </label>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <h5>Media library</h5>
      </mat-expansion-panel-header>
      <div class="inspector-section inspector-section-media">
        <button type="button" class="inspector-link" (click)="clearInlineImageMedia(image.id)"
          [disabled]="!(image.src || '').trim()">Clear image</button>
        <app-media-browser-carousel [allowDelete]="false" [viewMode]="'grid'"
          [selectedHandle]="image.mediaHandle ?? null"
          (mediaSelected)="onMediaSelected(image.id, $event)">
        </app-media-browser-carousel>
      </div>
    </mat-expansion-panel>
  </div>
  }
</div>
