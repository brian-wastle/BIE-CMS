<div #textboxRoot class="textbox-view"
  [style.--text-font-desktop.px]="fontSizes().desktop"
  [style.--text-font-tablet.px]="fontSizes().tablet"
  [style.--text-font-mobile.px]="fontSizes().mobile">
  <div class="textbox-content" [style.text-align]="textAlign()" [innerHTML]="richContent()"></div>
</div>
