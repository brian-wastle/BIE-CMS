<div class="videobox">
  @if (embedUrl(); as safeUrl) {
    <div class="video-frame" #videoFrame>
      <iframe class="video-embed" [src]="safeUrl" title="Embedded video" frameborder="0"
        [style.width.px]="embedWidth()" [style.height.px]="embedHeight()"
        allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
    @if (caption(); as videoCaption) {
      <p class="video-caption">{{ videoCaption }}</p>
    }
  } @else {
    <div class="video-placeholder">
      <p>No video selected.</p>
    </div>
  }
</div>
