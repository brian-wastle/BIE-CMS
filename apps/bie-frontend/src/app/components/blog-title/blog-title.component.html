<!-- Author -->
<div *ngIf="editable(); else readonly"
     class="title-author"
     authorScope
     (authorEditingChange)="editingChange.emit($event)">

  <div class="title-content">
    <input
    type="text"
    [value]="titleContent()"
    (input)="onInput($any($event.target).value)" />
  </div>

  <app-layout-controls
    class="title-controls"
    [layout]="block().layout"
    [totalColumns]="totalColumns()"
    [editable]="editable()"
    (layoutChange)="update.emit({ layout: $event })"
    (editingChange)="editingChange.emit($event)">
  </app-layout-controls>
</div>

<!-- Preview -->
<ng-template #readonly>
  <div class="title-view">
    <h1 class="title-line">{{ titleContent() }}</h1>
  </div>
</ng-template>
