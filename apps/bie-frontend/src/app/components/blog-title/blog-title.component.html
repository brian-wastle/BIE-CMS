<app-block-shell-template editClass="title-author" previewClass="title-view" controlsClass="title-controls">

  <ng-container blockAuthor>
    <div class="title-content">
      <input type="text" [value]="titleContent()" (input)="onInput($any($event.target).value)" />
    </div>
  </ng-container>

  <ng-container blockPreview>
    <h1 class="title-line">{{ titleContent() }}</h1>
  </ng-container>
</app-block-shell-template>
