<div class="img-preview">
  @if (block().src) {
    <div class="preview-wrap">
      <img class="media" [src]="block().src" [alt]="block().alt || ''" [style.width]="resolvedWidth()"
        [style.object-fit]="imageStyle().objectFit || 'cover'" (load)="onImageLoad()" (error)="onImageError()"
        [class.broken]="broken" />
      @if (broken) {
        <div class="broken-note">{{ block().alt || 'Failed to load image.' }}</div>
      }
    </div>
  } @else {
    <div class="media-placeholder">
      <p>No image selected.</p>
      <p class="media-placeholder-hint">Choose an image in the Inspector panel.</p>
    </div>
  }
</div>
