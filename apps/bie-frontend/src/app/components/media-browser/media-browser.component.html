<app-directory-browser
  [selectedDirectory]="selectedDirectory()"
  (selectedDirectoryChange)="onBrowserDirectoryChange($event)"
  (dirControlToggle)="onDirControlToggle($event)"
  [viewMode]="viewMode()">
</app-directory-browser>
<hr>
<app-media-picker
  [directory]="selectedDirectory()"
  [allowDelete]="allowDelete()"
  [allowSelection]="true"
  [selectedHandle]="selectedHandle()"
  (mediaDeleted)="mediaDeleted.emit($event)"
  (mediaSelected)="onMediaSelected($event)">
</app-media-picker>
