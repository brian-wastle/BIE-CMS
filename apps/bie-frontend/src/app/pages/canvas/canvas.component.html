<div class="canvas-layout"
  [class.author-mode]="authorMode"
  [class.preview-mode]="!authorMode">
  <header class="toolbar">
    <button (click)="authorMode = !authorMode">
      {{ authorMode ? 'Preview' : 'Back to Edit' }}
    </button>
  </header>

  <div class="canvas-area">
    <div class="grid" [style.--cols]="columns" [style.--gap.px]="gapPx" cdkDropList (click)="clearSelection()"
      (cdkDropListDropped)="onDrop($event)">

      <ng-container *ngFor="let block of pageBlocks(); trackBy: trackByBlockId">
        <!-- EDIT MODE -->
        <div class="block" [ngClass]="{selected: selectedId() === block.id}" [ngStyle]="gridStyle(block)"
          (click)="toggleSelect(block.id); $event.stopPropagation()"
          [cdkDragDisabled]="!authorMode || selectedId() === block.id" cdkDrag *ngIf="authorMode">

          <div class="chrome">
            <button (click)="remove(block.id); $event.stopPropagation()" title="Remove">×</button>
            <span class="handle" cdkDragHandle title="Drag to reorder">≡</span>
          </div>

          <app-textbox *ngIf="isTextBlock(block)" [block]="block" [editable]="true" [totalColumns]="columns"
            (editingChange)="onEditing(block.id, $event)" (update)="onBlockUpdate(block, $event)">
          </app-textbox>

          <app-imagebox *ngIf="isImageBlock(block)" [block]="block" [editable]="true" [totalColumns]="columns"
            (editingChange)="onEditing(block.id, $event)" (update)="onBlockUpdate(block, $event)">
          </app-imagebox>
        </div>

        <!-- PREVIEW MODE -->
        <div class="block" [ngStyle]="gridStyle(block)" *ngIf="!authorMode">
          <app-textbox *ngIf="isTextBlock(block)" [block]="block" [editable]="false"></app-textbox>
          <app-imagebox *ngIf="isImageBlock(block)" [block]="block" [editable]="false"></app-imagebox>
        </div>
      </ng-container>
    </div>
  </div>

  <aside class="component-palette">
    <h3>Add</h3>
    <button (click)="addText()">+ Text</button>
    <button (click)="addImage()">+ Image</button>
  </aside>

  <aside class="inspector" *ngIf="selected() as b">
    <h3>Inspector</h3>

    <label>Start column
      <input type="number" [min]="1" [max]="columns" [ngModel]="b.layout.colStart"
        (ngModelChange)="setColStart(b, +$event)">
    </label>

    <label>Span
      <input type="number" [min]="1" [max]="columns - b.layout.colStart + 1" [ngModel]="b.layout.colSpan"
        (ngModelChange)="setColSpan(b, +$event)">
    </label>

    <ng-container *ngIf="isImageBlock(b)">
      <label>Alt text
        <input type="text" [ngModel]="b.alt" (ngModelChange)="onBlockUpdate(b, { alt: $event })">
      </label>
      <label>Source URL
        <input type="text" [ngModel]="b.src" (ngModelChange)="onBlockUpdate(b, { src: $event })">
      </label>
    </ng-container>
  </aside>
</div>
