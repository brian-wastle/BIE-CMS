<div class="public-shell">
  <header class="public-header">
    <div class="brand">
      <a routerLink="/">brianwastle.net</a>
    </div>
    <nav class="public-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon class="nav-icon">home</mat-icon>
        <span class="nav-label">Home</span>
      </a>
      <a routerLink="/recipes" routerLinkActive="active">
        <mat-icon class="nav-icon">menu_book</mat-icon>
        <span class="nav-label">Cookbook</span>
      </a>
      <a href="https://github.com/brian-wastle" target="_blank" rel="noopener noreferrer">
        <mat-icon class="nav-icon">code</mat-icon>
        <span class="nav-label">GitHub</span>
      </a>
    </nav>
  </header>

  <main class="public-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="public-footer">
    powered by <a routerLink="/author">BIE-CMS</a>
  </footer>
</div>
